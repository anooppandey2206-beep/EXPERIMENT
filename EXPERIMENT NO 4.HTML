<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPERIMENT-4</title>
</head>

<body>
    <center>
        <h1>Hotel Room Booking Form</h1>
        <fieldset>

            <label for="name">FullName:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>
            <label for="date">Check-in Date:</label>
            <input type="date" id="date" name="date" required><br><br>
            <label for="date">Check-out Date:</label>
            <input type="date" id="date" name="date" required><br><br>
            <label for="room">Room Type:</label>
            <select id="room" name="room" required>
                <option value="">Select</option>
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="suite">Suite</option>
            </select><br><br>
            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" placeholder="No of Guests" required><br><br>
            <label for="requests">Special Requests:</label><br>
            <textarea id="requests" name="requests" rows="4" cols="50"></textarea><br><br>
            <input type="submit" value="Book Now">
            <input type="reset" value="Reset">
    </center>
    </fieldset>
</body>

</html>
