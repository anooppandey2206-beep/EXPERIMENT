<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment-5</title>
</head>

<body>
    <form action="./responce.html">
        <center>
            <h1>Student Registration Form</h1>
        </center>
        <hr>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" minlength="5" maxlength="15" Placeholder="Enter your full name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" Placeholder="Enter valid email address" required><br><br>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass" minlength="8" maxlength="20" Placeholder="Enter password" required>
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>
        <label for="cource">Cource</label>
        <select id="cource" name="cource" required>
            <option value="">--Select Cource--</option>
            <option value="btech">BTech</option>
            <option value="bca">BCA</option>
            <option value="bsc">BSC</option>
            <option value="bcom">BCOM</option>
            <option value="ba">BA</option>
        </select>
        <br><br>
        <label for="contact no">Contact No:</label>
        <input type="tel" id="contact no" name="contact no" placeholder="Enter phone number" maxlength="10" required>
        <br><br>
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="50" Placeholder="Enter your address" required></textarea>
        <br><br>
         <input type="Submit" value="Register"> 
            &nbsp;
            <input type="Reset" value="Clear">
            <hr>
    </form>
</body>

</html>
